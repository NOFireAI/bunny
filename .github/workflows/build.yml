name: 🍜 Build/publish runners

on:
  workflow_call:
    inputs:
      runner-archs:
        type: string
        default: '["amd64", "arm64"]'
      dockerfiles:
        type: string
        default: '["Dockerfile"]'
      runner-arch-map:
        type: string
        default: '[{"amd64":"x86_64", "aarch64":"aarch64", "armv7l":"armv7l"}]'
      registry:
        type: string
        default: 'ghcr.io'
      version-tag:
        type: boolean
        default: false
    secrets:
      GIT_CLONE_PAT:
        required: false
      AWS_ACCESS_KEY:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

jobs:
  build-all:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 600
    permissions:
      contents: write # for uploading the SBOM to the release
      packages: write # for uploading the finished container
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      id-token: write # to complete the identity challenge with sigstore/fulcio when running outside of PRs
    strategy:
      matrix:
        dockerfile: ["${{ fromJSON(inputs.dockerfiles) }}"]
        arch: ["${{ fromJSON(inputs.runner-archs) }}"]
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    continue-on-error: true

    env:
      REGISTRY: ${{ inputs.registry }}
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set lowercase image name
        run: |
          echo "REPO_LC=${REPO,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${REGISTRY,,}/${REPO,,}" >> "$GITHUB_ENV"
        env:
          REGISTRY: ${{ inputs.registry }}
          REPO: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ env.ARCH }}-
 
      - name: Build and push ${{ matrix.dockerfile }}-${{ matrix.arch}}
        id: build-and-push
        uses: docker/build-push-action@master
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          file: ${{ matrix.dockerfile }}
          #build-contexts: |
          # ${{ steps.base-image-calculator.outputs.base_image }}
          provenance: false
 
      - name: Get image digest
        run: |
          echo "IMAGE_DIGEST=$(docker inspect \
          ${{ env.REGISTRY }}/${{ env.REPO_LC }}:${{ env.ARCH }}-${{ env.SHA_SHORT }} | \
          jq -r '.[0].Id')" >> $GITHUB_ENV

      - name: Install cosign
        uses: sigstore/cosign-installer@main

      - name: Sign the published Docker image
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{steps.build-and-push.outputs.digest}}
        run: |
          cosign sign --new-bundle-format=false --use-signing-config=false --yes ${{ env.REGISTRY }}/${{ env.REPO_LC }}@$DIGEST \
          -a "repo=${{github.repository}}" \
          -a "workflow=${{github.workflow}}" \
          -a "ref=${{github.sha}}" \
          -a "author=NOFire AI"

  manifest:
    needs: [build-all]
    runs-on: ubuntu-latest
    permissions:
      contents: write # for uploading the SBOM to the release
      packages: write # for uploading the finished container
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      id-token: write # to complete the identity challenge with sigstore/fulcio when running outside of PRs
    strategy:
      matrix:
        dockerfile: ["${{ fromJSON(inputs.dockerfiles) }}"] 
    env:
      REGISTRY: ${{ inputs.registry }}
      #TAG: generic

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set lowercase image name
        run: echo "REPO_LC=${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker tag based on branch or PR
        id: tag
        run: |
          if [[ ${{ inputs.version-tag }} == true ]]; then
            echo "Version change detected. Using version: $( cat VERSION )."
            echo "TAG=$( cat VERSION ) " >> $GITHUB_ENV
          elif [[ "${GITHUB_REF##*/}" == "feat_nofire" ]]; then
            echo "Change in main branch detected. Using latest tag."
            echo "TAG=latest" >> $GITHUB_ENV
          else
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            echo "Using tag: ${SHORT_SHA}."
            echo "TAG=${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Process runner architectures and create docker manifest
        id: create-manifest
        run: |
          runner_archs='${{ inputs.runner-archs }}'  # Using the input string array
          amend_command=""

          for arch in $(echo $runner_archs | jq -r '.[]'); do
            amend_command+=" --amend ${{ env.REGISTRY }}/${{ env.REPO_LC }}:$arch-${{ env.SHA_SHORT }}"
          done

          echo "-------------------- Amend command constructed -------------------"
          echo "$amend_command"

          docker manifest create ${{ env.REGISTRY }}/${{ env.REPO_LC }}:${{ env.TAG }} $amend_command

          VAR=`docker manifest push ${{ env.REGISTRY }}/${{ env.REPO_LC }}:${{ env.TAG }} | tail -1`
          echo "manifest_sha=$VAR" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62

      - name: Sign the published Docker image
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{steps.create-manifest.outputs.manifest_sha }}
        run: |
          cosign sign --new-bundle-format=false --use-signing-config=false --yes ${{ env.REGISTRY }}/${{ env.REPO_LC }}@$DIGEST \
          -a "repo=${{github.repository}}" \
          -a "workflow=${{github.workflow}}" \
          -a "ref=${{github.sha}}" \
          -a "author=NOFire AI"
